<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GiftScout Reviews</title>

<link rel="stylesheet" href="css/reviews.css">

<script type="module" src="js/reviews.js"></script>

</head>

<body>

<header class="hero">

<img src="images/logo.png" class="logo" alt="GiftScout Logo">

<h1>Customer Reviews</h1>

<p>
Trusted by customers across India for thoughtful, personalized gift recommendations.
</p>

<div class="stats">

<div class="stat-card">

<h2 id="averageRating">⭐ 5.0</h2>

<span>Average Rating</span>

</div>

<div class="stat-card">

<h2 id="totalReviews">0</h2>

<span>Happy Customers</span>

</div>

<div class="stat-card">

<h2>100%</h2>

<span>Personalized Recommendations</span>

</div>

</div>

</header>

<section class="review-form">

<h2>Leave a Review</h2>

<form id="reviewForm">

<input
type="text"
id="name"
placeholder="Your Name"
required>

<select id="occasion">

<option>Birthday</option>

<option>Anniversary</option>

<option>Wedding</option>

<option>New Job</option>

<option>Festival</option>

<option>Baby Shower</option>

<option>Other</option>

</select>

<div class="stars">

<label><input type="radio" name="rating" value="5" checked> ⭐⭐⭐⭐⭐</label>

<label><input type="radio" name="rating" value="4"> ⭐⭐⭐⭐</label>

<label><input type="radio" name="rating" value="3"> ⭐⭐⭐</label>

<label><input type="radio" name="rating" value="2"> ⭐⭐</label>

<label><input type="radio" name="rating" value="1"> ⭐</label>

</div>

<textarea
id="review"
rows="5"
placeholder="Share your experience..."
required></textarea>

<label>

<input type="checkbox" required>

I agree to display my review publicly.

</label>

<button type="submit">

Submit Review

</button>

</form>

</section>

<section class="reviews">

<h2>What Our Customers Say ❤️</h2>

<div id="reviewsContainer">

Loading Reviews...

</div>

</section>

<footer>

<p>

© 2026 GiftScout • Presented by JK Recommends

</p>

</footer>

</body>

</html>
