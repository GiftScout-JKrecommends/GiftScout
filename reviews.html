<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review | GiftScout</title>

    <link rel="stylesheet" href="css/reviews.css">

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/reviews.js"></script>
</head>

<body>

<header>

    <img src="images/logo.png" class="logo">

    <h1>Leave a Review</h1>

    <p>Help others discover GiftScout by sharing your experience.</p>

</header>

<section class="review-form">

<form id="reviewForm">

<label>Your Name</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required>

<label>Occasion</label>

<select id="occasion">

<option>Birthday</option>

<option>Anniversary</option>

<option>Wedding</option>

<option>New Job</option>

<option>Festival</option>

<option>Baby Shower</option>

<option>Other</option>

</select>

<label>Rating</label>

<div class="stars">

<input type="radio" name="rating" value="5" checked>⭐⭐⭐⭐⭐

<br>

<input type="radio" name="rating" value="4">⭐⭐⭐⭐

<br>

<input type="radio" name="rating" value="3">⭐⭐⭐

<br>

<input type="radio" name="rating" value="2">⭐⭐

<br>

<input type="radio" name="rating" value="1">⭐

</div>

<label>Your Review</label>

<textarea
id="review"
rows="6"
placeholder="Tell us about your experience..."
required></textarea>

<label class="check">

<input
type="checkbox"
required>

I agree to display my review publicly after approval.

</label>

<button type="submit">

Submit Review

</button>

</form>

</section>

<section class="reviews">

<h2>Customer Reviews</h2>

<div id="reviewsContainer">

Loading reviews...

</div>

</section>

<footer>

<p>

© 2026 GiftScout |

Presented by JK Recommends

</p>

</footer>

</body>
</html>
